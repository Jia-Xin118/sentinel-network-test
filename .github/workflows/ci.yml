name: Validate Sentinel Network

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  secret-heuristic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block common credential formats
        run: |
          if rg --pcre2 '(?i)(ghp_[a-z0-9]{30,}|sk-[a-z0-9_-]{20,}|xox[baprs]-[a-z0-9-]{20,}|0x[a-f0-9]{64})' --glob '!**/*.lock' --glob '!README.md' --glob '!*.md'; then
            echo 'Potential credential detected.'
            exit 1
          fi
